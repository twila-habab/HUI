# Builds the Docker image and pushes it to Docker Hub on every push to main.
#
# Needs, under Settings → Secrets and variables → Actions:
#   Variable DOCKERHUB_USERNAME  your Docker Hub username
#   Variable DOCKERHUB_IMAGE     the image to push, e.g. yourname/discord-bot
#   Secret   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write access
name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lets the runner build the arm64 image too (e.g. for ARM nodes).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "latest" plus "sha-<commit>", so a deploy can pin an exact build.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
